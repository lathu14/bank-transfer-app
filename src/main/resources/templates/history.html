<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account History</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>Transaction History</h1>
        <p><strong>Account Number:</strong> <span th:text="${customer.accountNumber}">100001</span></p>
        <p><strong>Customer Name:</strong> <span th:text="${customer.fullName}">Kamal</span></p>
        <p><strong>Current Balance:</strong> LKR <span th:text="${customer.balance}">50000.00</span></p>

        <a href="/" style="display: inline-block; margin-bottom: 20px; text-decoration: none; background: #7f8c8d; color: white; padding: 8px 15px; border-radius: 4px;">&larr; Back to Dashboard</a>

        <h2>History Records</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>From Account</th>
                    <th>To Account</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Description</th>
                    <th>Date / Time</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="tx : ${transactions}">
                    <td th:text="${tx.id}">1</td>
                    <td th:text="${tx.fromAccount}">100001</td>
                    <td th:text="${tx.toAccount}">100002</td>
                    <td th:text="${tx.amount}">5000.00</td>
                    <td>
                        <span th:class="${tx.status.name() == 'SUCCESS'} ? 'badge-success' : 'badge-failed'" th:text="${tx.status}">SUCCESS</span>
                    </td>
                    <td th:text="${tx.description}">Completed</td>
                    <td th:text="${tx.createdAt}">2026-11-11</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
